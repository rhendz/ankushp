name: Home Visual Health

on:
  # Daily. This watches a decorative hero visual on a personal site, so the
  # every-30-minutes cadence it used to run at (~1,440 runs/month, each doing a
  # full npm ci plus a Chromium download) bought no signal the next day's run
  # would miss. Use workflow_dispatch for an on-demand check after a deploy.
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: home-visual-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOME_VISUAL_HEALTH_URL: https://www.ankushp.com
      HOME_VISUAL_HEALTH_SETTLE_MS: 4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # continue-on-error is required for the reporting step below to run at
      # all: an `if:` without a status check function has success() applied
      # implicitly, so `steps.health.outcome == 'failure'` could never be true
      # while a failing step still aborted the job. The incident issue was
      # therefore never created. The job is failed explicitly at the end.
      - name: Run home visual health check
        id: health
        continue-on-error: true
        run: npm run health:home-visual

      - name: Create incident issue on failure
        if: always() && steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'bug: homepage visual health check failed'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })

            const duplicate = existing.find((issue) => issue.title.toLowerCase() === title)
            if (duplicate) {
              core.info(`Open incident already exists: #${duplicate.number}`)
              return
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'Automated home visual health check detected a production runtime regression.',
                '',
                `- Workflow run: ${runUrl}`,
                '- Environment: production',
                '- Check script: `npm run health:home-visual`',
                '',
                'Please inspect console/runtime errors and confirm the homepage interactive visual path is healthy.'
              ].join('\n'),
              labels: ['bug'],
            })

      - name: Fail the run when unhealthy
        if: always() && steps.health.outcome == 'failure'
        run: |
          echo "Home visual health check reported a failure; see the step log above."
          exit 1
